<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Party — 2048</title><link rel="stylesheet" href="styles.css"><style>main{max-width:520px;margin:auto;padding:40px 20px}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#251c35;padding:8px;margin-top:24px}.tile{aspect-ratio:1;display:grid;place-items:center;background:#fffaf2;font-size:clamp(20px,7vw,32px);font-weight:bold}.tile[data-v="2"]{background:#fef3c7}.tile[data-v="4"]{background:#fde68a}.tile[data-v="8"]{background:#fdba74}.tile[data-v="16"]{background:#fb7185;color:white}.tile[data-v="32"]{background:#f472b6;color:white}.tile[data-v="64"]{background:#c084fc;color:white}.tile[data-v="128"]{background:#818cf8;color:white}.tile[data-v="256"]{background:#60a5fa;color:white}.tile[data-v="512"]{background:#22d3ee;color:#123}.tile[data-v="1024"]{background:#34d399;color:#123}.tile[data-v="2048"]{background:#a3e635;color:#123}.bar,.controls{display:flex;justify-content:space-between;gap:8px;font:12px 'DM Mono',monospace}.controls{justify-content:center;margin-top:12px}.controls button{width:48px;height:38px;border:0;background:#ffd166;font-size:18px}.hint{color:#756a81;font-size:14px}</style></head><body><main><a class="brand" href="index.html">PIXEL<span>PARTY</span></a><p class="eyebrow" style="margin-top:70px">03 // QUICK GAME</p><h1>2048</h1><p class="hint">Use arrow keys, swipe, or the buttons. Best score saves automatically.</p><div class="bar"><span>SCORE <b id="score">0</b></span><span>BEST <b id="best">0</b></span></div><div class="board" id="board"></div><div class="controls"><button data-m="up">↑</button><button data-m="left">←</button><button data-m="down">↓</button><button data-m="right">→</button></div><p><button class="button" id="new">NEW GAME</button> <a class="button" href="index.html#games">← BACK</a></p><p id="status" class="hint" aria-live="polite"></p></main><script>const board=document.querySelector('#board'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),status=document.querySelector('#status');let grid,score=0,best=+localStorage.getItem('pixel-party-2048-best')||0;bestEl.textContent=best;function start(){grid=Array(16).fill(0);score=0;status.textContent='';add();add();draw()}function add(){let e=grid.map((v,i)=>v?null:i).filter(v=>v!==null);if(e.length)grid[e[Math.floor(Math.random()*e.length)]]=Math.random()<.9?2:4}function draw(){board.innerHTML=grid.map(v=>`<div class="tile" data-v="${v}">${v||''}</div>`).join('');scoreEl.textContent=score}function canMove(){return grid.some(v=>!v)||grid.some((v,i)=>i%4<3&&v===grid[i+1])||grid.some((v,i)=>i<12&&v===grid[i+4])}function move(dir){let old=grid.join(),a=[];for(let r=0;r<4;r++){let row=dir==='left'||dir==='right'?grid.slice(r*4,r*4+4):[grid[r],grid[r+4],grid[r+8],grid[r+12]];if(dir==='right'||dir==='down')row.reverse();row=row.filter(Boolean);for(let i=0;i<row.length-1;i++)if(row[i]===row[i+1]){row[i]*=2;score+=row[i];row.splice(i+1,1)}while(row.length<4)row.push(0);if(dir==='right'||dir==='down')row.reverse();a.push(row)}if(dir==='left'||dir==='right')grid=a.flat();else for(let r=0;r<4;r++)for(let c=0;c<4;c++)grid[r*4+c]=a[c][r];if(old!==grid.join()){add();if(score>best){best=score;localStorage.setItem('pixel-party-2048-best',best);bestEl.textContent=best}if(grid.includes(2048))status.textContent='YOU REACHED 2048!';else if(!canMove())status.textContent='GAME OVER — START A NEW GAME';draw()}}document.addEventListener('keydown',e=>{let k={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(k){e.preventDefault();move(k)}});document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>move(b.dataset.m));document.querySelector('#new').onclick=start;start()</script></body></html>
