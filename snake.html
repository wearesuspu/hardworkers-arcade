<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Party — Snake</title><link rel="stylesheet" href="styles.css"><style>main{max-width:620px;margin:auto;padding:40px 20px}.game{background:#251c35;padding:16px;margin-top:24px}canvas{display:block;width:100%;image-rendering:pixelated;background:#fffaf2}.bar{display:flex;justify-content:space-between;align-items:center;color:white;font:12px 'DM Mono',monospace;padding:8px 0 16px}.button{display:inline-block;margin-top:18px}.hint{color:#756a81;font-size:14px;line-height:1.5}</style></head><body><main><a class="brand" href="index.html">PIXEL<span>PARTY</span></a><p class="eyebrow" style="margin-top:70px">01 // QUICK GAME</p><h1>Snake</h1><p class="hint">Use the arrow keys or WASD. Eat the pink dots and avoid your tail.</p><div class="game"><div class="bar"><span>SCORE <b id="score">0</b></span><span id="status">PRESS A KEY TO START</span></div><canvas id="board" width="400" height="400"></canvas></div><a class="button" href="index.html#games">← BACK TO GAMES</a></main><script>const c=document.querySelector('#board'),x=c.getContext('2d'),n=20,s=20;let snake,food,dir,next,score,running=false;function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];food={x:15,y:10};dir={x:1,y:0};next=dir;score=0;document.querySelector('#score').textContent=score;draw()}function place(){do{food={x:Math.floor(Math.random()*n),y:Math.floor(Math.random()*n)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}function draw(){x.fillStyle='#fffaf2';x.fillRect(0,0,400,400);x.fillStyle='#ff6f91';x.fillRect(food.x*s+3,food.y*s+3,14,14);snake.forEach((p,i)=>{x.fillStyle=i?'#b8f2e6':'#ffd166';x.fillRect(p.x*s+2,p.y*s+2,16,16)})}function tick(){if(!running)return;dir=next;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=n||h.y>=n||snake.some(p=>p.x===h.x&&p.y===h.y)){running=false;document.querySelector('#status').textContent='GAME OVER — PRESS A KEY';return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;document.querySelector('#score').textContent=score;place()}else snake.pop();draw()}document.addEventListener('keydown',e=>{let k=e.key.toLowerCase(),d=k==='arrowup'||k==='w'?{x:0,y:-1}:k==='arrowdown'||k==='s'?{x:0,y:1}:k==='arrowleft'||k==='a'?{x:-1,y:0}:k==='arrowright'||k==='d'?{x:1,y:0}:null;if(!d)return;e.preventDefault();if(!running){reset();running=true;document.querySelector('#status').textContent='PLAYING'}if(d.x!==-dir.x||d.y!==-dir.y)next=d});reset();setInterval(tick,130)</script></body></html>
